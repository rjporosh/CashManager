<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cash Manager</title>
<meta name="description" content="Offline-first cash denomination and inventory manager">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F5132">
<link rel="icon" href="assets/icon.svg" type="image/svg+xml">
<style>
/* ===================== DESIGN TOKENS ===================== */
:root{
  --ink:#182420;
  --ink-soft:#4B5A54;
  --paper:#F6F5F1;
  --surface:#FFFFFF;
  --surface-2:#EFEEE8;
  --line:#E1DFD6;
  --primary:#0F5132;
  --primary-ink:#FFFFFF;
  --primary-soft:#E4EFE8;
  --gold:#B8912E;
  --gold-soft:#F6EEDA;
  --danger:#B3261E;
  --danger-soft:#FBE9E7;
  --success:#1B7F4C;
  --radius-s:10px;
  --radius-m:16px;
  --radius-l:22px;
  --shadow:0 1px 2px rgba(24,36,32,.06), 0 8px 24px -12px rgba(24,36,32,.18);
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans","Helvetica Neue",Arial,sans-serif;
  --font-bn:"Noto Sans Bengali",var(--font);
}
:root[data-theme="dark"]{
  --ink:#EDEFEC;
  --ink-soft:#AEB8B2;
  --paper:#12160F;
  --surface:#1B211C;
  --surface-2:#232A24;
  --line:#2C342E;
  --primary:#3FAE7A;
  --primary-ink:#0A130E;
  --primary-soft:#183226;
  --gold:#E0C15B;
  --gold-soft:#33301A;
  --danger:#FF8A80;
  --danger-soft:#3A1F1C;
  --success:#5FCB93;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;font-family:var(--font);color:var(--ink);background:var(--paper);
  -webkit-font-smoothing:antialiased;padding-top:var(--safe-t);padding-bottom:var(--safe-b);
  min-height:100dvh;
}
html[lang="bn"] body{font-family:var(--font-bn)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0}
button{font-family:inherit}
a{color:inherit}
.num{font-variant-numeric:tabular-nums}
::selection{background:var(--primary-soft)}
:focus-visible{outline:2.5px solid var(--primary);outline-offset:2px;border-radius:6px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

/* ===================== SPLASH ===================== */
#splash{
  position:fixed;inset:0;background:linear-gradient(160deg,var(--primary) 0%,#0A3A24 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;z-index:999;
  transition:opacity .5s ease, visibility .5s ease;
}
#splash.hide{opacity:0;visibility:hidden;pointer-events:none}
.splash-mark{width:88px;height:88px;border-radius:24px;background:rgba(255,255,255,.12);
  display:flex;align-items:center;justify-content:center;margin-bottom:18px;
  animation:pop .7s cubic-bezier(.2,1.4,.4,1);}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.splash-title{font-size:26px;font-weight:800;letter-spacing:-.02em}
.splash-tag{font-size:14px;opacity:.8;margin-top:6px}
.splash-loader{margin-top:28px;width:120px;height:3px;background:rgba(255,255,255,.25);border-radius:2px;overflow:hidden}
.splash-loader>span{display:block;height:100%;width:40%;background:#fff;border-radius:2px;animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(320%)}}

/* ===================== APP SHELL ===================== */
#app{min-height:100dvh;display:flex;flex-direction:column}
.topbar{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:calc(14px + var(--safe-t)) 18px 12px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid transparent;
}
.topbar.scrolled{border-bottom-color:var(--line)}
.topbar h1{font-size:19px}
.topbar .sub{font-size:12px;color:var(--ink-soft);margin-top:2px}
.icon-btn{
  width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);
  display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink);
}
.icon-btn:active{transform:scale(.94)}
.layout{display:flex;flex:1;min-height:0}
.sidenav{display:none}
main#view{flex:1;padding:4px 18px calc(96px + var(--safe-b));max-width:920px;width:100%;margin:0 auto}
.bottomnav{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);
  border-top:1px solid var(--line);display:flex;padding-bottom:var(--safe-b);
}
.bottomnav button{
  flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:9px 2px 8px;color:var(--ink-soft);font-size:10.5px;cursor:pointer;min-height:44px;
}
.bottomnav button.active{color:var(--primary)}
.bottomnav svg{width:21px;height:21px}

@media (min-width:900px){
  .bottomnav{display:none}
  .sidenav{
    display:flex;flex-direction:column;width:230px;flex-shrink:0;padding:20px 12px;
    border-right:1px solid var(--line);gap:2px;
  }
  .sidenav .brand{display:flex;align-items:center;gap:10px;padding:6px 10px 22px}
  .sidenav .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--primary);display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .sidenav button{
    display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:12px;border:0;background:none;
    color:var(--ink-soft);font-size:14.5px;text-align:left;cursor:pointer;font-weight:600;
  }
  .sidenav button.active{background:var(--primary-soft);color:var(--primary)}
  .sidenav svg{width:19px;height:19px;flex-shrink:0}
  main#view{padding:24px 32px 40px}
  .topbar{padding:20px 32px 12px}
}

/* ===================== COMPONENTS ===================== */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px}
.section-title{font-size:13px;font-weight:700;color:var(--ink-soft);text-transform:none;margin:22px 0 10px;display:flex;align-items:center;justify-content:space-between}
.hero{
  background:linear-gradient(160deg,var(--primary) 0%, #0A3A24 100%);color:#fff;border-radius:var(--radius-l);
  padding:22px 20px;margin-top:6px;position:relative;overflow:hidden;
}
.hero .label{font-size:13px;opacity:.85;font-weight:600}
.hero .amount{font-size:clamp(30px,8vw,44px);font-weight:800;letter-spacing:-.02em;margin-top:4px}
.hero .split{display:flex;gap:10px;margin-top:16px}
.hero .split>div{flex:1;background:rgba(255,255,255,.12);border-radius:14px;padding:10px 12px}
.hero .split .k{font-size:11px;opacity:.8}
.hero .split .v{font-size:16px;font-weight:700;margin-top:2px}
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:12px}
@media (min-width:640px){.stat-grid{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:13px 14px}
.stat .v{font-size:19px;font-weight:800}
.stat .k{font-size:11.5px;color:var(--ink-soft);margin-top:2px}
.denom-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.denom-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:13px}
.denom-card .val{font-size:17px;font-weight:800}
.denom-card .pc{font-size:12px;color:var(--ink-soft);margin-top:2px}
.denom-card .tv{font-size:13px;font-weight:700;color:var(--primary);margin-top:8px}
.denom-card.archived{opacity:.55}
.tag{display:inline-flex;align-items:center;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--surface-2);color:var(--ink-soft)}
.tag.note{background:var(--primary-soft);color:var(--primary)}
.tag.coin{background:var(--gold-soft);color:var(--gold)}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.btn{
  appearance:none;border:0;border-radius:14px;padding:13px 18px;font-size:14.5px;font-weight:700;
  cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;
}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:active{transform:scale(.98)}
.btn-ghost{background:var(--surface-2);color:var(--ink)}
.btn-danger{background:var(--danger-soft);color:var(--danger)}
.btn-block{width:100%}
.btn-sm{padding:8px 12px;font-size:13px;border-radius:10px;min-height:36px}
.fab{
  position:fixed;right:18px;bottom:calc(84px + var(--safe-b));z-index:25;background:var(--primary);color:#fff;
  width:56px;height:56px;border-radius:50%;border:0;box-shadow:var(--shadow);display:flex;align-items:center;
  justify-content:center;cursor:pointer;
}
@media (min-width:900px){.fab{display:none}}
.field{margin-bottom:14px}
.field label{display:block;font-size:12.5px;font-weight:700;color:var(--ink-soft);margin-bottom:6px}
.field input[type=text],.field input[type=number],.field input[type=tel],.field input[type=date],.field select,.field textarea{
  width:100%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:12px;
  padding:11px 13px;font-size:15px;min-height:44px;
}
.field textarea{min-height:70px;resize:vertical}
.field .hint{font-size:11.5px;color:var(--ink-soft);margin-top:5px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.switch{display:inline-flex;align-items:center;gap:9px;cursor:pointer;user-select:none}
.switch input{display:none}
.switch .track{width:42px;height:25px;background:var(--surface-2);border:1.5px solid var(--line);border-radius:20px;position:relative;transition:.2s}
.switch .track::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;background:#fff;border-radius:50%;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:.2s}
.switch input:checked+.track{background:var(--primary);border-color:var(--primary)}
.switch input:checked+.track::after{transform:translateX(17px)}
.empty{text-align:center;padding:44px 16px;color:var(--ink-soft)}
.empty .ic{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;background:var(--surface-2);display:flex;align-items:center;justify-content:center}
.empty .t{font-weight:700;color:var(--ink);font-size:15px}
.empty .d{font-size:13px;margin-top:4px}
.chip-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;-webkit-overflow-scrolling:touch}
.chip-row::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 14px;border-radius:20px;border:1.5px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-soft);min-height:36px}
.chip.active{background:var(--primary);border-color:var(--primary);color:#fff}
.txn-item{border:1px solid var(--line);border-radius:var(--radius-m);margin-bottom:10px;overflow:hidden;background:var(--surface)}
.txn-head{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer}
.txn-ic{width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.txn-body{padding:0 14px 14px;font-size:13px;color:var(--ink-soft);display:none;border-top:1px dashed var(--line);margin-top:2px;padding-top:12px}
.txn-item.open .txn-body{display:block}
.kv{display:flex;justify-content:space-between;padding:4px 0}
.modal-back{position:fixed;inset:0;background:rgba(15,20,17,.5);z-index:80;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:640px){.modal-back{align-items:center}}
.modal{background:var(--surface);border-radius:22px 22px 0 0;width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;padding:20px 20px calc(20px + var(--safe-b));animation:up .25s ease}
@media (min-width:640px){.modal{border-radius:22px;max-height:80dvh}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.modal-head h3{font-size:17px}
.toast-host{position:fixed;left:0;right:0;bottom:calc(94px + var(--safe-b));z-index:90;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
@media (min-width:900px){.toast-host{bottom:24px}}
.toast{background:var(--ink);color:var(--paper);padding:11px 18px;border-radius:30px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow);max-width:90vw}
:root[data-theme="dark"] .toast{background:var(--surface-2);color:var(--ink)}
.toast.err{background:var(--danger)}
.progress-mini{display:flex;align-items:center;justify-content:space-between;padding:8px 0}
.adv-note-row{display:grid;grid-template-columns:34px 1fr 100px 60px;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.adv-note-row input[type=text],.adv-note-row select{padding:7px 8px;font-size:12.5px;min-height:36px;border-radius:9px;border:1.5px solid var(--line)}
.scroller-x{overflow-x:auto}
table.simple{width:100%;border-collapse:collapse;font-size:13px}
table.simple th{text-align:left;color:var(--ink-soft);font-weight:700;padding:6px 8px;border-bottom:1px solid var(--line);font-size:11.5px}
table.simple td{padding:8px;border-bottom:1px solid var(--line)}
.avatar{width:72px;height:72px;border-radius:50%;object-fit:cover;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.link-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
.link-row .ic{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.link-row>div{min-width:0;overflow-wrap:anywhere}
</style>
</head>

/* ============================================================
   DB LAYER (IndexedDB)
============================================================ */
const DB_NAME='cashManagerDB', DB_VERSION=1;
let _db=null;
function idbOpen(){
  return new Promise((res,rej)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('meta')) db.createObjectStore('meta',{keyPath:'key'});
      if(!db.objectStoreNames.contains('denominations')) db.createObjectStore('denominations',{keyPath:'id'});
      if(!db.objectStoreNames.contains('stock')) db.createObjectStore('stock',{keyPath:'id'});
      if(!db.objectStoreNames.contains('items')){
        const s = db.createObjectStore('items',{keyPath:'id',autoIncrement:true});
        s.createIndex('denominationId','denominationId');
      }
      if(!db.objectStoreNames.contains('transactions')){
        const s = db.createObjectStore('transactions',{keyPath:'id',autoIncrement:true});
        s.createIndex('timestamp','timestamp');
      }
    };
    req.onsuccess = ()=>{ _db=req.result; res(_db); };
    req.onerror = ()=>rej(req.error);
  });
}
function tx(storeNames,mode='readonly'){ return _db.transaction(storeNames,mode); }
function idbGetAll(store){
  return new Promise((res,rej)=>{
    const r = tx(store).objectStore(store).getAll();
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function idbGet(store,key){
  return new Promise((res,rej)=>{
    const r = tx(store).objectStore(store).get(key);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function idbPut(store,val){
  return new Promise((res,rej)=>{
    const t = tx(store,'readwrite'); const r = t.objectStore(store).put(val);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function idbAdd(store,val){
  return new Promise((res,rej)=>{
    const t = tx(store,'readwrite'); const r = t.objectStore(store).add(val);
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
  });
}
function idbDelete(store,key){
  return new Promise((res,rej)=>{
    const t = tx(store,'readwrite'); const r = t.objectStore(store).delete(key);
    r.onsuccess=()=>res(); r.onerror=()=>rej(r.error);
  });
}
function idbClear(store){
  return new Promise((res,rej)=>{
    const t = tx(store,'readwrite'); const r = t.objectStore(store).clear();
    r.onsuccess=()=>res(); r.onerror=()=>rej(r.error);
  });
}

   STATE
============================================================ */
const DEFAULT_CONFIG = {
  key:'config', country:'Bangladesh', currencyName:'Taka', shortName:'Tk',
  iso:'BDT', symbol:'৳', lang:'en', theme:'light'
};
const DEFAULT_BRANDING = { key:'branding', photo:null };
const STATE = {
  config: {...DEFAULT_CONFIG},
  branding: {...DEFAULT_BRANDING},
  denominations: [],
  stock: [],
  items: [],
  transactions: [],
};

function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }

async function seedDefaultsIfNeeded(){
  const existing = await idbGetAll('denominations');
  if(existing.length>0) return;
  const notes = [2,5,10,20,50,100,500,1000];
  const coins = [1,2,5];
  const now = Date.now();
  for(const v of notes){
    await idbPut('denominations', { id:uid('den'), type:'note', value:v, currency:'BDT', status:'active', advanced:false, createdAt:now });
  }
  for(const v of coins){
    await idbPut('denominations', { id:uid('den'), type:'coin', value:v, currency:'BDT', status:'active', advanced:false, createdAt:now });
  }
}

async function loadState(){
  const cfg = await idbGet('meta','config');
  STATE.config = cfg ? {...DEFAULT_CONFIG, ...cfg} : {...DEFAULT_CONFIG};
  const br = await idbGet('meta','branding');
  STATE.branding = br ? {...DEFAULT_BRANDING, ...br} : {...DEFAULT_BRANDING};
  STATE.denominations = (await idbGetAll('denominations')).sort((a,b)=> a.type===b.type ? a.value-b.value : (a.type==='note'?-1:1));
  STATE.stock = await idbGetAll('stock');
  STATE.items = await idbGetAll('items');
  STATE.transactions = (await idbGetAll('transactions')).sort((a,b)=>b.timestamp-a.timestamp);
  document.documentElement.setAttribute('data-theme', STATE.config.theme || 'light');
  document.documentElement.setAttribute('lang', STATE.config.lang || 'en');
}
async function saveConfig(){ await idbPut('meta', {...STATE.config, key:'config'}); }
async function saveBranding(){ await idbPut('meta', {...STATE.branding, key:'branding'}); }

   BUSINESS LOGIC HELPERS
============================================================ */
function fmtMoney(n){
  n = Math.round((n+Number.EPSILON)*100)/100;
  const parts = Math.abs(n).toFixed(n%1===0?0:2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{2})+(?!\d)(?=\d{3}(?!\d)))|\B(?=\d{3}(?=(\d{2})*$)(?!\d{4}))/g, ',')
    .replace(/^(\d)(\d\d)(?=,)/,'$1$2');
  // simplified south-asian grouping
  parts[0] = groupIndian(Math.abs(Math.trunc(n)).toString());
  const sign = n<0?'-':'';
  return `${sign}${STATE.config.symbol} ${parts.join('.')}`;
}
function groupIndian(numStr){
  if(numStr.length<=3) return numStr;
  let last3 = numStr.slice(-3);
  let rest = numStr.slice(0,-3);
  rest = rest.replace(/\B(?=(\d{2})+(?!\d))/g, ',');
  return rest+','+last3;
}
function fmtDate(ts){
  const d = new Date(ts);
  const day = d.getDate();
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  let h = d.getHours(); const m = d.getMinutes().toString().padStart(2,'0');
  const ampm = h>=12?'PM':'AM'; h = h%12; if(h===0) h=12;
  return `${day} ${months[d.getMonth()]} ${d.getFullYear()}, ${h}:${m} ${ampm}`;
}
function fmtDateShort(ts){
  const d = new Date(ts);
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${d.getDate()} ${months[d.getMonth()]} ${d.getFullYear()}`;
}
function stockRowsFor(denomId){ return STATE.stock.filter(s=>s.denominationId===denomId); }
function itemsFor(denomId){ return STATE.items.filter(i=>i.denominationId===denomId && i.active!==false); }
function quantityFor(denomId){
  const agg = stockRowsFor(denomId).reduce((s,r)=>s+r.quantity,0);
  const ind = itemsFor(denomId).length;
  return agg+ind;
}
function conditionBreakdown(denomId){
  const b = {new:0, old:0, mediumOld:0, general:0, torn:0, total:0};
  stockRowsFor(denomId).forEach(r=>{ b[r.condition]=(b[r.condition]||0)+r.quantity; if(r.torn) b.torn+=r.quantity; b.total+=r.quantity; });
  itemsFor(denomId).forEach(i=>{ b[i.condition]=(b[i.condition]||0)+1; if(i.torn) b.torn+=1; b.total+=1; });
  return b;
}
function denomValue(d){ return quantityFor(d.id)*d.value; }
function totalCash(){ return STATE.denominations.reduce((s,d)=>s+denomValue(d),0); }
function totalByType(type){ return STATE.denominations.filter(d=>d.type===type).reduce((s,d)=>s+denomValue(d),0); }
function piecesByType(type){ return STATE.denominations.filter(d=>d.type===type).reduce((s,d)=>s+quantityFor(d.id),0); }
function activeDenoms(){ return STATE.denominations.filter(d=>d.status==='active'); }

async function recordTransaction(data){
  const t = { timestamp: Date.now(), ...data };
  const id = await idbAdd('transactions', t);
  STATE.transactions.unshift({...t,id});
}
async function upsertStock(denomId, condition, torn, deltaQty){
  const rowId = `${denomId}|${condition}|${torn?1:0}`;
  let row = STATE.stock.find(s=>s.id===rowId);
  if(!row){ row = {id:rowId, denominationId:denomId, condition, torn:!!torn, quantity:0}; }
  row.quantity += deltaQty;
  if(row.quantity<0) row.quantity=0;
  await idbPut('stock', row);
  const idx = STATE.stock.findIndex(s=>s.id===rowId);
  if(idx>=0) STATE.stock[idx]=row; else STATE.stock.push(row);
  return row;
}

============================================================ */
function toast(msg, type){
  const host = document.getElementById('toastHost');
  const el = document.createElement('div');
  el.className = 'toast'+(type==='err'?' err':'');
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>{ el.style.transition='opacity .3s'; el.style.opacity='0'; setTimeout(()=>el.remove(),300); }, 2600);
}
function confirmDialog({title, body, confirmLabel, danger}){
  return new Promise((resolve)=>{
    const host = document.getElementById('dialogHost');
    host.innerHTML = `
      <div class="modal-back" data-role="back">
        <div class="modal" role="alertdialog" aria-modal="true">
          <div class="modal-head"><h3>${escapeHtml(title)}</h3></div>
          <p style="color:var(--ink-soft);font-size:14px;line-height:1.5">${escapeHtml(body)}</p>
          <div style="display:flex;gap:10px;margin-top:20px">
            <button class="btn btn-ghost btn-block" data-role="cancel">${t('cancel')}</button>
            <button class="btn ${danger?'btn-danger':'btn-primary'} btn-block" data-role="ok">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      </div>`;
    host.querySelector('[data-role="cancel"]').onclick=()=>{host.innerHTML='';resolve(false)};
    host.querySelector('[data-role="back"]').addEventListener('click',(e)=>{ if(e.target.dataset.role==='back'){host.innerHTML='';resolve(false);} });
    host.querySelector('[data-role="ok"]').onclick=()=>{host.innerHTML='';resolve(true)};
  });
}
function openModal(innerHtml, onMount){
  const host = document.getElementById('dialogHost');
  host.innerHTML = `<div class="modal-back" data-role="back"><div class="modal" role="dialog" aria-modal="true">${innerHtml}</div></div>`;
  host.querySelector('[data-role="back"]').addEventListener('click',(e)=>{ if(e.target.dataset.role==='back') closeModal(); });
  if(onMount) onMount(host);
}
function closeModal(){ document.getElementById('dialogHost').innerHTML=''; }
function escapeHtml(s){ return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function emptyState(iconName, title, desc){
  return `<div class="empty"><div class="ic">${icon(iconName,26)}</div><div class="t">${escapeHtml(title)}</div><div class="d">${escapeHtml(desc)}</div></div>`;
}

function openAdjustModal(denomId){
  const d = STATE.denominations.find(x=>x.id===denomId); if(!d) return;
  const b = conditionBreakdown(denomId);
  const conditions = d.type==='note' ? ['general','new','old','mediumOld'] : ['general','new','old'];
  openModal(`
    <div class="modal-head"><h3>${t('conditionEdit')}</h3><button class="icon-btn" data-role="x">${icon('minus',16)}</button></div>
    <div style="font-size:13px;color:var(--ink-soft);margin-bottom:10px" class="num">${fmtMoney(d.value)} · ${t('currentQty')}: ${quantityFor(denomId)}</div>
    ${conditions.map(c=>`<div class="field"><label>${t('condition_'+c)}</label><input type="number" min="0" inputmode="numeric" id="adj-${c}" value="${b[c]||0}"></div>`).join('')}
    <div class="field"><label>${t('tornCount')}</label><input type="number" min="0" inputmode="numeric" id="adj-torn" value="${b.torn||0}"></div>
    <button class="btn btn-primary btn-block" id="adjSave">${t('saveAdjustment')}</button>
  `, (host)=>{
    host.querySelector('[data-role="x"]').onclick=closeModal;
    host.querySelector('#adjSave').onclick= async ()=>{
      const prevQty = quantityFor(denomId);
      for(const c of conditions){
        const val = Math.max(0, parseInt(host.querySelector('#adj-'+c).value)||0);
        const row = STATE.stock.find(s=>s.denominationId===denomId && s.condition===c && !s.torn);
        const cur = row?row.quantity:0;
        if(val!==cur) await upsertStock(denomId,c,false,val-cur);
      }
      const tornVal = Math.max(0, parseInt(host.querySelector('#adj-torn').value)||0);
      const tornRow = STATE.stock.find(s=>s.denominationId===denomId && s.torn);
      const curTorn = tornRow?tornRow.quantity:0;
      if(tornVal!==curTorn) await upsertStock(denomId,'general',true,tornVal-curTorn);
      const newQty = quantityFor(denomId);
      await recordTransaction({type:'ADJUSTMENT', denominationId:denomId, denomValue:d.value, cashType:d.type, quantity:newQty-prevQty, amount:(newQty-prevQty)*d.value, previousQty:prevQty, newQty, note:''});
      closeModal(); toast(t('savedSuccess')); router();
    };
  });
}

function openRemoveModal(){
  const avail = STATE.denominations.filter(d=>quantityFor(d.id)>0);
  if(!avail.length){ toast(t('insufficientStock'),'err'); return; }
  openModal(`
    <div class="modal-head"><h3>${t('removeCash')}</h3><button class="icon-btn" data-role="x">${icon('minus',16)}</button></div>
    <div class="field"><label>${t('selectDenom')}</label>
      <select id="rmDenom">${avail.map(d=>`<option value="${d.id}">${fmtMoney(d.value)} · ${d.type==='note'?t('note'):t('coin')} (${quantityFor(d.id)} ${t('available')})</option>`).join('')}</select>
    </div>
    <div class="field"><label>${t('quantity')}</label><input type="number" min="1" id="rmQty" inputmode="numeric" value="1"></div>
    <div class="field"><label>${t('note_optional')}</label><textarea id="rmNote"></textarea></div>

  `,(host)=>{
    host.querySelector('[data-role="x"]').onclick=closeModal;
    host.querySelector('#rmSubmit').onclick= async ()=>{
      const denomId = host.querySelector('#rmDenom').value;
      const qty = parseInt(host.querySelector('#rmQty').value)||0;
      const noteText = host.querySelector('#rmNote').value||'';
      const d = STATE.denominations.find(x=>x.id===denomId);
      const avail2 = quantityFor(denomId);
      if(qty<=0) return;
      if(qty>avail2){ toast(t('cannotRemoveMore'),'err'); return; }
      const ok = await confirmDialog({title:t('confirmRemoveTitle'), body:`${fmtMoney(d.value)} × ${qty} = ${fmtMoney(d.value*qty)}`, confirmLabel:t('yesRemove'), danger:true});
      if(!ok) return;
      const prevQty = avail2;
      await consumeQuantity(denomId, qty);
      const newQty = quantityFor(denomId);
      await recordTransaction({type:'REMOVE', denominationId:denomId, denomValue:d.value, cashType:d.type, quantity:qty, amount:qty*d.value, previousQty:prevQty, newQty, note: noteText});
      toast(t('cashRemoved')); router();
    };
  });
}
async function consumeQuantity(denomId, qty){
  let remaining = qty;
  const rows = stockRowsFor(denomId).slice().sort((a,b)=> (a.condition==='general'?-1:1) - (b.condition==='general'?-1:1));
  for(const row of rows){
    if(remaining<=0) break;
    const take = Math.min(row.quantity, remaining);
    if(take>0){ await upsertStock(denomId,row.condition,row.torn,-take); remaining-=take; }
  }
  if(remaining>0){
    const its = itemsFor(denomId).slice().sort((a,b)=>a.id-b.id);
    for(const it of its){
      if(remaining<=0) break;
      it.active=false; await idbPut('items', it);
      const idx=STATE.items.findIndex(x=>x.id===it.id); if(idx>=0) STATE.items[idx]=it;
      remaining--;
    }
  }
}

      closeModal(); toast(t('transferSuccess')); router();

function onAddQtyChange(e){
  const id = e.target.dataset.qty;
  const qty = Math.max(0, parseInt(e.target.value)||0);
  addDraft[id].qty = qty;
  const d = STATE.denominations.find(x=>x.id===id);
  document.getElementById('rowtotal-'+id).textContent = `${fmtMoney(d.value)} × ${qty} = ${fmtMoney(d.value*qty)}`;
  if(addDraft[id].individual) renderIndividualRows(id);
  updateGrandTotal();
}
function onIndividualToggle(e){
  const id = e.target.dataset.ind;
  addDraft[id].individual = e.target.checked;
  if(e.target.checked) renderIndividualRows(id);
  else document.getElementById('rowsbox-'+id).innerHTML='';
}
function renderIndividualRows(id){
  const d = STATE.denominations.find(x=>x.id===id);
  const qty = addDraft[id].qty;
  const rows = addDraft[id].rows;
  while(rows.length<qty) rows.push({serial:'', condition:'general', torn:false});
  rows.length = qty;
  const box = document.getElementById('rowsbox-'+id);
  if(qty===0){ box.innerHTML=''; return; }
  const conditions = d.type==='note' ? ['general','new','old','mediumOld'] : ['general','new','old'];
  box.innerHTML = `<p class="hint" style="margin:8px 0">${t('generateRows')}</p>
    <div class="scroller-x">${rows.map((r,i)=>`
      <div class="adv-note-row">
        <span class="num">${t('seq')}${String(i+1).padStart(3,'0')}</span>
        ${d.type==='note'?`<input type="text" placeholder="${t('serial')}" data-row="${id}:${i}:serial" value="${escapeHtml(r.serial)}">`:'<span></span>'}
        <select data-row="${id}:${i}:condition">${conditions.map(c=>`<option value="${c}" ${r.condition===c?'selected':''}>${t('condition_'+c)}</option>`).join('')}</select>
        ${d.type==='note'?`<label style="display:flex;align-items:center;gap:4px;font-size:11px"><input type="checkbox" data-row="${id}:${i}:torn" ${r.torn?'checked':''}> ${t('torn')}</label>`:'<span></span>'}
      </div>`).join('')}</div>`;
  box.querySelectorAll('[data-row]').forEach(el=>{
    el.addEventListener(el.type==='checkbox'?'change':'input', (e)=>{
      const [denId,idx,field] = e.target.dataset.row.split(':');
      const val = e.target.type==='checkbox' ? e.target.checked : e.target.value;
      addDraft[denId].rows[+idx][field] = val;
    });
  });
}
function updateGrandTotal(){
  const total = Object.entries(addDraft).reduce((s,[id,v])=>{ const d=STATE.denominations.find(x=>x.id===id); return s+(d?d.value*v.qty:0); },0);
  const el = document.getElementById('grandTotal'); if(el) el.textContent = fmtMoney(total);
}
async function submitAddCash(){
  const entries = Object.entries(addDraft).filter(([id,v])=>v.qty>0);
  if(!entries.length){ toast(t('enterValue'),'err'); return; }
  for(const [id,v] of entries){
    const d = STATE.denominations.find(x=>x.id===id);
    const prevQty = quantityFor(id);
    if(v.individual){
      for(const row of v.rows){
        await idbAdd('items', {denominationId:id, serial:row.serial||'', condition:row.condition||'general', torn:!!row.torn, active:true, createdAt:Date.now()});
      }
      STATE.items = await idbGetAll('items');
    } else {
      await upsertStock(id,'general',false,v.qty);
    }
    const newQty = quantityFor(id);
    await recordTransaction({type:'ADD', denominationId:id, denomValue:d.value, cashType:d.type, quantity:v.qty, amount:v.qty*d.value, previousQty:prevQty, newQty, note:''});
  }
  toast(t('cashAdded'));
  navigate('dashboard');
}

function handlePhotoUpload(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const img = new Image();
    img.onload = async ()=>{
      const max = 480;
      let w=img.width, h=img.height;
      if(w>h && w>max){ h=Math.round(h*max/w); w=max; } else if(h>=w && h>max){ w=Math.round(w*max/h); h=max; }
      const canvas = document.createElement('canvas'); canvas.width=w; canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      STATE.branding.photo = canvas.toDataURL('image/jpeg', 0.85);
      await saveBranding(); router();
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}
async function exportBackup(){
  const payload = { version:1, exportedAt:Date.now(), config:STATE.config, branding:{key:'branding',photo:null}, denominations:STATE.denominations, stock:STATE.stock, items:STATE.items, transactions:STATE.transactions };
  const blob = new Blob([JSON.stringify(payload,null,2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date(); const stamp = `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`;
  a.href = url; a.download = `cash-manager-backup-${stamp}.json`; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast(t('backupExported'));
}
function importBackup(e){
  const file = e.target.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const data = JSON.parse(ev.target.result);
      if(!data || !Array.isArray(data.denominations) || !Array.isArray(data.stock) || !Array.isArray(data.items) || !Array.isArray(data.transactions)){
        toast(t('backupInvalid'),'err'); return;
      }
      const ok = await confirmDialog({title:t('importBackup'), body:t('confirmClearBody'), confirmLabel:t('save'), danger:true});
      if(!ok) return;
      await idbClear('denominations'); await idbClear('stock'); await idbClear('items'); await idbClear('transactions');
      for(const d of data.denominations) await idbPut('denominations', d);
      for(const s of data.stock) await idbPut('stock', s);
      for(const i of data.items) await idbAdd('items', {...i, id:undefined}).catch(()=>idbPut('items',i));
      for(const tr of data.transactions) await idbAdd('transactions', {...tr, id:undefined}).catch(()=>idbPut('transactions',tr));
      if(data.config) { STATE.config = {...STATE.config, ...data.config}; await saveConfig(); }
      await loadState();
      toast(t('backupImported')); fullRerender();
    }catch(err){ toast(t('backupInvalid'),'err'); }
  };
  reader.readAsText(file);
}
async function clearAllData(){
  const ok = await confirmDialog({title:t('confirmClearTitle'), body:t('confirmClearBody'), confirmLabel:t('yesClear'), danger:true});
  if(!ok) return;
  await idbClear('denominations'); await idbClear('stock'); await idbClear('items'); await idbClear('transactions');
  await seedDefaultsIfNeeded();
  await loadState();
  toast(t('dataCleared')); fullRerender();
}
